<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="12" y1="32" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="1.5" />

  <!-- Background subtle grid / calendar hints -->
  <rect x="14" y="14" width="36" height="36" rx="8" stroke="#10b981" stroke-opacity="0.15" stroke-width="1" fill="#064e3b" fill-opacity="0.2" />

  <!-- Outer Orbit Nodes -->
  <circle cx="20" cy="20" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="44" cy="20" r="2" fill="#34d399" opacity="0.8" />
  <circle cx="44" cy="44" r="2" fill="#10b981" opacity="0.8" />
  <circle cx="20" cy="44" r="2" fill="#059669" opacity="0.8" />

  <!-- Central Pulse waveform / send glyph -->
  <path d="M16 32h6l4-8 6 16 5-11 3 5 8-2" stroke="url(#pulseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Rocket / Broadcast Signal Dot -->
  <circle cx="48" cy="32" r="3" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="48" cy="32" r="6" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
</svg>
